<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>form 태그</title>
</head>
<body>
    <h1>회원 정보 입력 폼</h1>
    <nav>
        <a href="kimbomin.html" target="_blank">김보민 자기소개</a>
    </nav>
    <form>
        <p>
            <label for="name">이름</label><br>
            <label for="hello">안녕하세요</label><br>
            <input type="text" id="name" name="name" placeholder="이름을 입력하세요">
            <input type="text" id="hello" name="hello" placeholder="안녕하세요">
        </p>

        <p>
            성별<br>
            <label>
                <input type="radio" name="gender" value="male"> 남자
            </label>
            <label>
                <input type="radio" name="gender" value="female"> 여자
            </label>
        </p>

        <p>
            <label for="birth"> 생일 </label><br>
            <input type="date" name="birth">
        </p>

        <p>
            <label for="age">나이</label><br>
            <input type="number" name="age" min="1" max="120" step="2" placeholder="나이를 입력하세요">
        </p>

        <p>
            <label for="intro">소개글</label><br>
            <textarea name="intro" rows="5" cols="30" placeholder="자기소개를 입력하세요"></textarea>
        </p>

        <p>
            <label for="grade">학년</label><br>
            <select name="grade">
                <option value="">선택하세요</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
                <option value="4">4학년</option>

            </select>
        </p>

        <p>
            <input type="submit" value="제출" >
            <input type="reset" value="초기화">
        </p>
    </form>
</body>
</html>
